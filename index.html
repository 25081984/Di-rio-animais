<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitorização Fecal Pet</title>
    
    <style>
        :root {
            --primary: #4a90e2;
            --success: #2ecc71;
            --danger: #e74c3c;
            --dark: #2c3e50;
            --light: #f5f7fa;
            --card-bg: #ffffff;
            --dog-color: #e67e22;
            --cat-color: #9b59b6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--light);
            color: var(--dark);
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--dark);
            margin-bottom: 5px;
        }

        header p {
            color: #7f8c8d;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .card h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--light);
            padding-bottom: 8px;
        }

        .species-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .species-grid {
                grid-template-columns: 1fr;
            }
        }

        .species-zone {
            padding: 15px;
            border-radius: 6px;
            background-color: #fcfdfd;
            border: 1px dashed #ccd1d9;
        }

        .species-zone.dog { border-color: var(--dog-color); }
        .species-zone.cat { border-color: var(--cat-color); }

        .species-zone h3 {
            font-size: 1rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .species-zone.dog h3 { color: var(--dog-color); }
        .species-zone.cat h3 { color: var(--cat-color); }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        .form-group.inline {
            flex-direction: row;
            gap: 10px;
        }

        .form-group.inline input {
            flex: 2;
        }

        label {
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        input, select, textarea {
            padding: 10px;
            border: 1px solid #ccd1d9;
            border-radius: 4px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            background-color: var(--primary);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #357abd;
        }

        .btn-dog { background-color: var(--dog-color); }
        .btn-dog:hover { background-color: #d35400; }

        .btn-cat { background-color: var(--cat-color); }
        .btn-cat:hover { background-color: #8e44ad; }

        .btn-success {
            background-color: var(--success);
            width: 100%;
            margin-top: 10px;
        }

        .btn-success:hover {
            background-color: #27ae60;
        }

        .btn-delete {
            background-color: var(--danger);
            padding: 5px 10px;
            font-size: 0.8rem;
        }

        .btn-sync {
            background-color: #7f8c8d;
            font-size: 0.85rem;
        }
        
        .btn-pdf {
            background-color: #e74c3c;
            font-size: 0.85rem;
        }

        .sync-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .button-group button {
            flex: 1;
            min-width: 150px;
        }

        .help-text {
            margin-top: 5px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            text-align: left;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #e6e9ed;
            font-size: 0.95rem;
        }

        th {
            background-color: #f8f9fa;
            font-weight: 600;
        }

        .score-badge {
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: bold;
            color: white;
            display: inline-block;
        }
        .score-1 { background-color: #e74c3c; }
        .score-2 { background-color: #e67e22; }
        .score-3 { background-color: #f1c40f; color: #2c3e50; }
        .score-4 { background-color: #2ecc71; }
        .score-5 { background-color: #95a5a6; }
        .score-6 { background-color: #34495e; }

        /* ESTILOS EXCLUSIVOS PARA IMPRESSÃO EM PDF */
        @media print {
            body { background-color: #fff; padding: 0; }
            .card:not(.printable) { display: none !important; }
            .btn-delete, header p { display: none !important; }
            .card { box-shadow: none; padding: 0; }
            th, td { padding: 8px; border-bottom: 1px solid #000; }
            .score-badge { border: 1px solid #000; color: #000 !important; background: transparent !important; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🐾 Diário de Score Fecal</h1>
            <p>Monitore a saúde gastrointestinal dos seus cães e gatos</p>
        </header>

        <!-- Seção de Sincronização e PDF -->
        <section class="card">
            <h2>Compartilhar e Sincronizar</h2>
            <div class="sync-box">
                <div class="button-group">
                    <button class="btn-pdf" onclick="generatePDF()">📄 Gerar Relatório PDF</button>
                    <button class="btn-sync" onclick="sendEmailBackup()">✉️ Enviar Dados por E-mail</button>
                </div>
                
                <div class="form-group" style="margin-top: 10px;">
                    <label for="importCode">Importar Dados Recebidos (Cole o código do e-mail aqui):</label>
                    <textarea id="importCode" rows="2" placeholder="Cole aqui o código texto enviado por e-mail..."></textarea>
                    <button class="btn-sync" onclick="importFromText()" style="margin-top: 8px; background-color: #2c3e50;">📥 Confirmar Importação</button>
                </div>
            </div>
        </section>

        <!-- Gerenciar Animais -->
        <section class="card">
            <h2>Gerenciar Animais</h2>
            <div class="species-grid">
                <div class="species-zone dog">
                    <h3>🐶 Cadastrar Cão</h3>
                    <div class="form-group inline">
                        <input type="text" id="dogName" placeholder="Nome do cão">
                        <button class="btn-dog" onclick="addPet('Cão', 'dogName')">Adicionar</button>
                    </div>
                </div>
                <div class="species-zone cat">
                    <h3>🐱 Cadastrar Gato</h3>
                    <div class="form-group inline">
                        <input type="text" id="catName" placeholder="Nome do gato">
                        <button class="btn-cat" onclick="addPet('Gato', 'catName')">Adicionar</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Registrar Score -->
        <section class="card">
            <h2>Registrar Score Diário</h2>
            <form id="scoreForm" onsubmit="saveScore(event)">
                <div class="species-grid" style="margin-bottom: 15px;">
                    <div class="form-group">
                        <label for="dogSelect" style="color: var(--dog-color);">🐶 Selecionar Cão:</label>
                        <select id="dogSelect" onchange="togglePetSelection('dog')">
                            <option value="" selected>Escolha um cão...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="catSelect" style="color: var(--cat-color);">🐱 Selecionar Gato:</label>
                        <select id="catSelect" onchange="togglePetSelection('cat')">
                            <option value="" selected>Escolha um gato...</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="fecalScore">Score Fecal (1 a 6):</label>
                    <select id="fecalScore" required onchange="updateScoreDescription()">
                        <option value="" disabled selected>Selecione o score...</option>
                        <option value="1">1 - Diarreia líquida / Aquosa</option>
                        <option value="2">2 - Pastosa / Forma mal definida</option>
                        <option value="3">3 - Úmida / Formada, mas deixa marcas</option>
                        <option value="4">4 - Ideal / Bem formada, firme, não deixa marcas</option>
                        <option value="5">5 - Seca / Dura, fragmenta-se facilmente</option>
                        <option value="6">6 - Ressecadas / Extremamente duras (Constipação)</option>
                    </select>
                    <small id="scoreHelp" class="help-text"></small>
                </div>

                <div class="form-group">
                    <label for="logDate">Data:</label>
                    <input type="date" id="logDate" required>
                </div>

                <button type="submit" class="btn-success">Gravar Registro</button>
            </form>
        </section>

        <!-- Histórico (Classe printable adicionada para o PDF) -->
        <section class="card printable">
            <h2>Histórico de Registros</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Animal</th>
                            <th>Espécie</th>
                            <th>Score</th>
                            <th>Descrição</th>
                            <th class="btn-delete">Ação</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody"></tbody>
                </table>
            </div>
        </section>
    </div>

    <script>
        let pets = JSON.parse(localStorage.getItem('pets')) || [];
        let historyLogs = JSON.parse(localStorage.getItem('historyLogs')) || [];

        const scoreDescriptions = {
            1: "Diarreia líquida", 2: "Pastosa / Mal definida", 3: "Úmida / Deixa marcas",
            4: "Ideal / Firme", 5: "Seca / Dura", 6: "Ressecada (Constipação)"
        };

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('logDate').valueAsDate = new Date();
            updatePetDropdowns();
            renderHistory();
        });

        function addPet(type, inputId) {
            const petNameInput = document.getElementById(inputId);
            const name = petNameInput.value.trim();
            if (!name) return alert(`Por favor, digite o nome.`);
            if (pets.some(pet => pet.name.toLowerCase() === name.toLowerCase() && pet.type === type)) return alert("Já cadastrado.");
            
            pets.push({ name, type });
            localStorage.setItem('pets', JSON.stringify(pets));
            petNameInput.value = '';
            updatePetDropdowns();
        }

        function updatePetDropdowns() {
            const dogSelect = document.getElementById('dogSelect');
            const catSelect = document.getElementById('catSelect');
            dogSelect.innerHTML = '<option value="" selected>Escolha um cão...</option>';
            catSelect.innerHTML = '<option value="" selected>Escolha um gato...</option>';

            pets.sort((a, b) => a.name.localeCompare(b.name)).forEach(pet => {
                const option = document.createElement('option');
                option.value = JSON.stringify(pet);
                option.textContent = pet.name;
                if (pet.type === 'Cão') dogSelect.appendChild(option);
                else if (pet.type === 'Gato') catSelect.appendChild(option);
            });
        }

        function togglePetSelection(chosenType) {
            if (chosenType === 'dog') document.getElementById('catSelect').selectedIndex = 0;
            else document.getElementById('dogSelect').selectedIndex = 0;
        }

        function saveScore(event) {
            event.preventDefault();
            const dogSelect = document.getElementById('dogSelect');
            const catSelect = document.getElementById('catSelect');
            const fecalScore = document.getElementById('fecalScore').value;
            const logDate = document.getElementById('logDate').value;

            const selectedValue = dogSelect.value || catSelect.value;
            if (!selectedValue) return alert("Selecione um animal.");

            const petData = JSON.parse(selectedValue);
            const newLog = { id: Date.now(), petName: petData.name, petType: petData.type, score: parseInt(fecalScore), date: formatDate(logDate) };

            historyLogs.unshift(newLog);
            localStorage.setItem('historyLogs', JSON.stringify(historyLogs));
            document.getElementById('scoreForm').reset();
            document.getElementById('logDate').valueAsDate = new Date();
            renderHistory();
        }

        function formatDate(dateString) {
            const parts = dateString.split('-');
            return `${parts[2]}/${parts[1]}/${parts[0]}`;
        }

        function renderHistory() {
            const tbody = document.getElementById('historyTableBody');
            tbody.innerHTML = '';
            if (historyLogs.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#95a5a6;">Nenhum registro.</td></tr>`;
                return;
            }
            historyLogs.forEach(log => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${log.date}</td><td><strong>${log.petName}</strong></td><td>${log.petType}</td>
                    <td><span class="score-badge score-${log.score}">${log.score}</span></td><td>${scoreDescriptions[log.score]}</td>
                    <td class="btn-delete"><button class="btn-delete" onclick="deleteLog(${log.id})">Excluir</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function deleteLog(id) {
            if (confirm("Apagar este registro?")) {
                historyLogs = historyLogs.filter(log => log.id !== id);
                localStorage.setItem('historyLogs', JSON.stringify(historyLogs));
                renderHistory();
            }
        }

        function updateScoreDescription() {
            const score = document.getElementById('fecalScore').value;
            const helpText = document.getElementById('scoreHelp');
            if(score) {
                helpText.textContent = `Selecionado: ${scoreDescriptions[score]}`;
                if (score == 1 || score == 6) helpText.style.color = '#e74c3c';
                else if (score == 4) helpText.style.color = '#2ecc71';
                else helpText.style.color = '#e67e22';
            }
        }

        // --- FUNÇÃO PARA IMPRIMIR EM PDF ---
        function generatePDF() {
            window.print(); // Ativa as configurações CSS de impressão ocultando botões e focando no histórico
        }

        // --- ENVIAR BACKUP COMPATÍVEL VIA EMAIL ---
        function sendEmailBackup() {
            const dataStr = JSON.stringify({ pets, historyLogs });
            const assunto = encodeURIComponent("Backup - Diário de Score Fecal");
            
            const corpoEmail = encodeURIComponent(
                "Olá!\n\nEste é o código de sincronização do seu Diário de Score Fecal.\n" +
                "Para importar estes dados em outro dispositivo, copie TODO o código abaixo, abra o sistema no outro aparelho e cole-o no campo de importação.\n\n" +
                "CÓDIGO DE IMPORTAÇÃO:\n" + dataStr
            );
            
            // Abre o aplicativo de email padrão do dispositivo
            window.location.href = `mailto:?subject=${assunto}&body=${corpoEmail}`;
        }

        // --- IMPORTAR O TEXTO RECEBIDO NO OUTRO DISPOSITIVO ---
        function importFromText() {
            const codeArea = document.getElementById('importCode');
            const codeText = codeArea.value.trim();

            if (!codeText) {
                alert("Por favor, cole o código do e-mail no campo de texto antes de importar.");
                return;
            }

            try {
                const content = JSON.parse(codeText);
                if (content.pets && content.historyLogs) {
                    if (confirm("Isto substituirá os dados locais deste dispositivo. Deseja prosseguir?")) {
                        pets = content.pets;
                        historyLogs = content.historyLogs;
                        localStorage.setItem('pets', JSON.stringify(pets));
                        localStorage.setItem('historyLogs', JSON.stringify(historyLogs));
                        updatePetDropdowns();
                        renderHistory();
                        codeArea.value = '';
                        alert("Dados importados e sincronizados com sucesso!");
                    }
                } else {
                    alert("O formato do código está incompleto ou incorreto.");
                }
            } catch (err) {
                alert("Código inválido. Certifique-se de copiar todo o bloco de texto do e-mail.");
            }
        }
    </script>
</body>
</html>
